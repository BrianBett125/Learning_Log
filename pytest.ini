[pytest]
DJANGO_SETTINGS_MODULE = ll_project.settings
python_files = test_*.py

# The suite runs on PostgreSQL; there is no SQLite path (Phase 1). The
# connection string comes from DATABASE_URL in ll_project/settings.py, so start
# the database first: `docker compose up -d db`. pytest-django builds and drops a
# throwaway test_<name> database around the session.
#
# --create-db is pinned so the test database is rebuilt every run, whatever a
# developer has in PYTEST_ADDOPTS; a reused database would let a stale schema
# hide a missing migration. --strict-markers fails on a mistyped marker instead
# of silently ignoring it.
addopts = --create-db --strict-markers

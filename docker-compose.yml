# Local development services for Maarifa.
#
# Start the database before running the app or the test suite:
#   docker compose up -d db
#
# The app reads its connection from DATABASE_URL (see .env.example). When that
# variable is unset, ll_project/settings.py falls back to the URL published here,
# so `docker compose up -d db && python manage.py migrate` works on a clean
# checkout with no further configuration.
services:
  db:
    # pgvector ships the `vector` extension for later phases (plan §1.3); the
    # image is PostgreSQL 17 plus the extension, so no separate install is needed.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: maarifa
      POSTGRES_PASSWORD: maarifa
      POSTGRES_DB: maarifa
    ports:
      # Published on 5433 so a system PostgreSQL already bound to 5432 does not
      # collide. Override with POSTGRES_PORT in the shell or .env if 5433 is taken.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on first initialization of the data volume.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maarifa -d maarifa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
